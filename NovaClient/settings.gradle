pluginManagement {
    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        // Newer Minecraft versions need a newer Loom. The release pipeline passes -Ploom_version for each version;
        // building by hand without it uses the one that is known to work for the default 1.21.4.
        id 'fabric-loom' version (settings.providers.gradleProperty('loom_version').getOrElse('1.9-SNAPSHOT'))
    }
}
