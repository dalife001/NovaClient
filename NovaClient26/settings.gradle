pluginManagement {
    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        // 26.1.x: Loom 1.16, 26.2 and newer: Loom 1.17. The pipeline passes -Ploom_version.
        id 'net.fabricmc.fabric-loom' version (settings.providers.gradleProperty('loom_version').getOrElse('1.16-SNAPSHOT'))
    }
}
