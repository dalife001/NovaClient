# Push a tag like v0.3.1 and everything below happens automatically:
# builds the mod + launcher, writes latest.json, publishes a GitHub Release.
# Players' launchers read latest.json and update themselves on the next Play.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        working-directory: NovaClient
        run: gradle build -Pmod_version=${GITHUB_REF_NAME#v}

      - name: Build launcher
        working-directory: NovaLauncher
        run: ./build.sh

      - name: Write latest.json
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          MC=$(grep '^minecraft_version=' NovaClient/gradle.properties | cut -d= -f2)
          LAUNCHER=$(sed -n 's/.*VERSION = "\(.*\)";/\1/p' NovaLauncher/src/com/nova/launcher/GameLauncher.java)
          JAR=NovaClient/build/libs/novaclient-$VERSION.jar
          SHA=$(sha256sum "$JAR" | cut -d' ' -f1)
          BASE=https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}
          cat > latest.json <<JSON
          {
            "version": "$VERSION",
            "minecraft": "$MC",
            "mod": { "url": "$BASE/novaclient-$VERSION.jar", "sha256": "$SHA" },
            "launcher": { "version": "$LAUNCHER", "url": "$BASE/NovaLauncher.jar" }
          }
          JSON
          cat latest.json

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            NovaClient/build/libs/novaclient-*.jar
            NovaLauncher/NovaLauncher.jar
            latest.json
