# Step 1 of the Minecraft 26.x port.
#
# Minecraft 26.x has no Yarn names any more, only Mojang's. This job takes the code exactly as it is built for
# 1.21.11 (the last Yarn version) and lets Loom rewrite every Minecraft name to Mojang's names automatically.
# The result is uploaded as the artifact "mojang-1.21.11": download it and send it to whoever maintains the code.
#
# Run it: Actions tab > "Port to Mojang names" > Run workflow.
name: Port to Mojang names
on:
  workflow_dispatch:
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - name: Rewrite the 1.21.11 code to Mojang names
        id: migrate
        continue-on-error: true
        working-directory: NovaClient
        run: |
          set -o pipefail
          P="-Pminecraft_version=1.21.11 -Pyarn_mappings=1.21.11+build.6 -Pfabric_version=0.141.6+1.21.11 -Pjava_version=21 -Ploom_version=1.14-SNAPSHOT -Pstrict_mixins=false"
          {
            gradle preprocess $P --no-daemon --stacktrace
            gradle migrateMappings $P --no-daemon --stacktrace \
              --mappings "net.minecraft:mappings:1.21.11" \
              --input build/pp/java --output build/mojmap/java
          } 2>&1 | tee migrate.log
          mkdir -p out
          cp -r build/mojmap/java out/java
          cp -r build/pp/resources out/resources
      - name: Keep the result
        if: steps.migrate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: mojang-1.21.11
          path: NovaClient/out
          if-no-files-found: error
      - name: Keep the log if it failed
        if: steps.migrate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: FAILED-migrate-log
          path: NovaClient/migrate.log
      - name: Show the problem in the summary
        if: steps.migrate.outcome == 'failure'
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -A12 "What went wrong" NovaClient/migrate.log | head -30 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit 1
